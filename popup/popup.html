<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      body {
        font-family: system-ui, -apple-system, sans-serif;
        width: 240px;
        padding: 12px;
        margin: 0;
      }
      label {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 14px;
        cursor: pointer;
      }
      #status {
        margin-top: 10px;
        font-size: 12px;
        color: #555;
        word-break: break-all;
      }
      h1 {
        font-size: 15px;
        margin: 0 0 10px;
      }
      fieldset {
        border: 1px solid #ddd;
        border-radius: 6px;
        margin: 10px 0 0;
        padding: 8px 10px;
      }
      legend {
        font-size: 12px;
        color: #555;
        padding: 0 4px;
      }
      fieldset label {
        font-size: 13px;
      }
    </style>
  </head>
  <body>
    <h1>Chess Supporter</h1>
    <label><input type="checkbox" id="enabled" /> Włącz podpowiedzi</label>
    <fieldset>
      <legend>Grasz jako</legend>
      <label><input type="radio" name="playerColor" value="w" /> Białe</label>
      <label><input type="radio" name="playerColor" value="b" /> Czarne</label>
    </fieldset>
    <div id="status">Otwórz partię na chess.com/play/...</div>
    <script src="popup.js"></script>
  </body>
</html>
